<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>COVID-19 Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>🌍 COVID-19 Global Stats</h1>
    <div class="stats">
      <div class="card" id="confirmed">
        <h2>Confirmed</h2>
        <p id="totalConfirmed">Loading...</p>
      </div>
      <div class="card" id="deaths">
        <h2>Deaths</h2>
        <p id="totalDeaths">Loading...</p>
      </div>
      <div class="card" id="recovered">
        <h2>Recovered</h2>
        <p id="totalRecovered">Loading...</p>
      </div>
    </div>
  </div>
  <script src="script.js">  </script>
</body>
</html>
