<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COVID-19 Info</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container text-center">
    <h2 class="mt-5">COVID-19</h2>
    <div class="row justify-content-center">
      <div class="col-md-4">
        <select id="countries" class="form-select" onchange="displayCovid()">
          <option value="" class="text-center text-dark">-- Select a Country --</option>
        </select>
      </div>
    </div>
    <div class="row justify-content-center mt-4">
      <div class="col-md-6">
        <div id="covid" class="border rounded p-4 shadow-sm">
          <p>Select a country to see COVID-19 data.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
